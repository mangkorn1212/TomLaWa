<!DOCTYPE html>
<html lang="lo" class="scroll-smooth dark bg-[#08050e]" style="background-color: #08050e !important; color-scheme: dark;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ເຂົ້າສູ່ລະບົບ Admin - {{ settings.store_name }}</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#faf5ff',
              100: '#f3e8ff',
              200: '#e9d5ff',
              300: '#d8b4fe',
              400: '#c084fc',
              500: '#a855f7',
              600: '#9333ea',
              700: '#7e22ce',
              800: '#6b21a8',
              900: '#581c87',
              950: '#2e1065',
            }
          },
          fontFamily: {
            sans: ['"Noto Sans Lao"', '"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Font Awesome 6.5 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/css/style.css?v=2.2.0">
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-[#08050e] via-[#140a25] to-[#08050e] relative overflow-hidden text-slate-100" style="background-color: #08050e !important;">

  <!-- Ambient Cyber Glow Elements -->
  <div class="absolute -top-32 -right-32 w-96 h-96 rounded-full bg-purple-600/20 blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -left-32 w-96 h-96 rounded-full bg-fuchsia-500/15 blur-3xl pointer-events-none"></div>

  <!-- Login Card Container -->
  <div class="relative z-10 max-w-md w-full bg-[#140d24]/95 backdrop-blur-2xl rounded-3xl p-7 sm:p-9 border border-purple-500/30 shadow-2xl space-y-6 text-white">
    
    <!-- Logo & Title -->
    <div class="text-center space-y-2">
      <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-purple-700 via-fuchsia-600 to-amber-400 text-slate-950 flex items-center justify-center text-3xl mx-auto shadow-xl shadow-purple-600/30 border border-purple-400/30">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      
      <div>
        <h2 class="text-2xl font-black text-white tracking-tight">ເຂົ້າສູ່ລະບົບຜູ້ດູແລ</h2>
        <p class="text-xs text-purple-300 font-bold mt-0.5">Admin Management System</p>
        <p class="text-[11px] text-purple-400/70 mt-1">{{ settings.store_name }}</p>
      </div>
    </div>

    <!-- Error Alert Box -->
    <div id="login-error-box" class="hidden p-3.5 rounded-2xl bg-rose-950/60 border border-rose-800/60 text-rose-300 text-xs font-bold flex items-center gap-2">
      <i class="fa-solid fa-circle-exclamation text-rose-400 text-sm"></i>
      <span id="login-error-msg">ຊື່ຜູ້ໃຊ້ ຫຼື ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ</span>
    </div>

    <!-- Login Form -->
    <form onsubmit="handleAdminLogin(event)" class="space-y-4">
      
      <!-- Username Field -->
      <div>
        <label class="block text-xs font-bold text-purple-200 mb-1.5">
          ຊື່ຜູ້ໃຊ້ (Username)
        </label>
        <div class="relative">
          <i class="fa-solid fa-user absolute left-4 top-3.5 text-purple-400/60 text-xs"></i>
          <input type="text" id="admin_username" required placeholder="ປ້ອນຊື່ຜູ້ໃຊ້" autocomplete="off" class="w-full pl-10 pr-4 py-3 rounded-2xl bg-[#0e081c] border border-purple-900/60 focus:outline-none focus:ring-2 focus:ring-purple-500/40 focus:border-purple-500 text-white placeholder-purple-400/40 text-sm font-semibold transition" />
        </div>
      </div>

      <!-- Password Field -->
      <div>
        <label class="block text-xs font-bold text-purple-200 mb-1.5">
          ລະຫັດຜ່ານ (Password)
        </label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-4 top-3.5 text-purple-400/60 text-xs"></i>
          <input type="password" id="admin_password" required placeholder="ປ້ອນລະຫັດຜ່ານ" autocomplete="new-password" class="w-full pl-10 pr-10 py-3 rounded-2xl bg-[#0e081c] border border-purple-900/60 focus:outline-none focus:ring-2 focus:ring-purple-500/40 focus:border-purple-500 text-white placeholder-purple-400/40 text-sm font-semibold transition" />
          <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-3.5 text-purple-400 hover:text-white text-xs">
            <i class="fa-regular fa-eye" id="pwd-eye-icon"></i>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <div class="pt-2">
        <button type="submit" id="login-btn" class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-purple-600 via-fuchsia-600 to-amber-400 hover:from-purple-500 hover:to-amber-300 active:scale-98 text-slate-950 font-black text-sm shadow-xl shadow-purple-600/30 hover:shadow-2xl transition-all flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-to-bracket text-slate-950"></i>
          <span>ເຂົ້າສູ່ລະບົບ (Login)</span>
        </button>
      </div>

    </form>

    <!-- Back to Store Link -->
    <div class="text-center pt-1">
      <a href="/" class="text-xs font-bold text-purple-300 hover:text-white transition inline-flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-left text-[10px]"></i>
        <span>ກັບໄປໜ້າຮ້ານຄ້າສຳລັບລູກຄ້າ</span>
      </a>
    </div>

  </div>

  <script>
  function togglePasswordVisibility() {
    const pwdInput = document.getElementById("admin_password");
    const eyeIcon = document.getElementById("pwd-eye-icon");
    if (pwdInput.type === "password") {
      pwdInput.type = "text";
      eyeIcon.className = "fa-regular fa-eye-slash";
    } else {
      pwdInput.type = "password";
      eyeIcon.className = "fa-regular fa-eye";
    }
  }

  async function handleAdminLogin(e) {
    e.preventDefault();
    const u = document.getElementById("admin_username").value.trim();
    const p = document.getElementById("admin_password").value.trim();
    const btn = document.getElementById("login-btn");
    const errorBox = document.getElementById("login-error-box");
    const errorMsg = document.getElementById("login-error-msg");

    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>ກຳລັງກວດສອບ...</span>`;
    errorBox.classList.add("hidden");

    try {
      const res = await fetch("/api/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: u, password: p })
      });

      const data = await res.json();
      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> <span>ເຂົ້າສູ່ລະບົບ (Login)</span>`;

      if (res.ok && data.success) {
        window.location.href = "/admin";
      } else {
        errorBox.classList.remove("hidden");
        errorMsg.textContent = data.message || "ຊື່ຜູ້ໃຊ້ ຫຼື ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ";
      }
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> <span>ເຂົ້າສູ່ລະບົບ (Login)</span>`;
      errorBox.classList.remove("hidden");
      errorMsg.textContent = "ເກີດຂໍ້ຜິດພາດ: " + err.message;
    }
  }
  </script>

</body>
</html>
