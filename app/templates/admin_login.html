<!DOCTYPE html>
<html lang="lo" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ເຂົ້າສູ່ລະບົບ Admin - {{ settings.store_name }}</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fffbeb',
              100: '#fef3c7',
              200: '#fde68a',
              300: '#fcd34d',
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
              700: '#b45309',
              800: '#92400e',
              900: '#78350f',
              950: '#451a03',
            }
          },
          fontFamily: {
            sans: ['"Noto Sans Lao"', '"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Font Awesome 6.5 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-stone-950 to-slate-950 relative overflow-hidden text-slate-900">

  <!-- Ambient Glow Elements -->
  <div class="absolute -top-32 -right-32 w-96 h-96 rounded-full bg-amber-500/15 blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -left-32 w-96 h-96 rounded-full bg-yellow-400/10 blur-3xl pointer-events-none"></div>

  <!-- Login Card Container -->
  <div class="relative z-10 max-w-md w-full bg-white/95 backdrop-blur-2xl rounded-3xl p-7 sm:p-9 border border-amber-500/25 shadow-2xl space-y-6">
    
    <!-- Logo & Title -->
    <div class="text-center space-y-2">
      <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-slate-900 to-stone-700 text-white flex items-center justify-center text-3xl mx-auto shadow-xl shadow-amber-500/30 border border-white/20">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      
      <div>
        <h2 class="text-2xl font-black text-slate-900 tracking-tight">ເຂົ້າສູ່ລະບົບຜູ້ດູແລ</h2>
        <p class="text-xs text-amber-800 font-bold mt-0.5">Admin Management System</p>
        <p class="text-[11px] text-slate-400 mt-1">{{ settings.store_name }}</p>
      </div>
    </div>

    <!-- Error Alert Box -->
    <div id="login-error-box" class="hidden p-3.5 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-bold flex items-center gap-2">
      <i class="fa-solid fa-circle-exclamation text-rose-500 text-sm"></i>
      <span id="login-error-msg">ຊື່ຜູ້ໃຊ້ ຫຼື ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ</span>
    </div>

    <!-- Login Form -->
    <form onsubmit="handleAdminLogin(event)" class="space-y-4">
      
      <!-- Username Field -->
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">
          ຊື່ຜູ້ໃຊ້ (Username)
        </label>
        <div class="relative">
          <i class="fa-solid fa-user absolute left-4 top-3.5 text-slate-400 text-xs"></i>
          <input type="text" id="admin_username" required placeholder="admin" value="admin" class="w-full pl-10 pr-4 py-3 rounded-2xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm font-semibold transition" />
        </div>
      </div>

      <!-- Password Field -->
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">
          ລະຫັດຜ່ານ (Password)
        </label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400 text-xs"></i>
          <input type="password" id="admin_password" required placeholder="ລະຫັດຜ່ານ" value="admin123" class="w-full pl-10 pr-10 py-3 rounded-2xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm font-semibold transition" />
          <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-3.5 text-slate-400 hover:text-slate-600 text-xs">
            <i class="fa-regular fa-eye" id="pwd-eye-icon"></i>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <div class="pt-2">
        <button type="submit" id="login-btn" class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-amber-500 via-amber-400 to-yellow-400 hover:from-amber-400 hover:to-yellow-300 active:scale-98 text-slate-950 font-black text-sm shadow-xl shadow-amber-500/30 hover:shadow-2xl transition-all flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>ເຂົ້າສູ່ລະບົບ (Login)</span>
        </button>
      </div>

    </form>

    <!-- Default Login Hint -->
    <div class="p-3 bg-amber-50/70 rounded-2xl border border-amber-200 text-center text-xs text-amber-900">
      <span class="font-bold">🔑 ຂໍ້ມູນເຂົ້າລະບົບເລີ່ມຕົ້ນ (Default):</span>
      <div class="font-mono text-[11px] text-amber-700 mt-1">
        User: <strong class="text-slate-900">admin</strong> &nbsp;|&nbsp; Pass: <strong class="text-slate-900">admin123</strong>
      </div>
      <div class="text-[10px] text-slate-400 mt-0.5">(ສາມາດປ່ຽນລະຫັດຜ່ານໄດ້ໃນເມນູຕັ້ງຄ່າຫຼັງບ້ານ)</div>
    </div>

    <!-- Back to Store Link -->
    <div class="text-center pt-1">
      <a href="/" class="text-xs font-bold text-slate-500 hover:text-amber-700 transition inline-flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-left text-[10px]"></i>
        <span>ກັບໄປໜ້າຮ້ານຄ້າສຳລັບລູກຄ້າ</span>
      </a>
    </div>

  </div>

  <script>
  function togglePasswordVisibility() {
    const pwdInput = document.getElementById("admin_password");
    const eyeIcon = document.getElementById("pwd-eye-icon");
    if (pwdInput.type === "password") {
      pwdInput.type = "text";
      eyeIcon.className = "fa-regular fa-eye-slash";
    } else {
      pwdInput.type = "password";
      eyeIcon.className = "fa-regular fa-eye";
    }
  }

  async function handleAdminLogin(e) {
    e.preventDefault();
    const u = document.getElementById("admin_username").value.trim();
    const p = document.getElementById("admin_password").value.trim();
    const btn = document.getElementById("login-btn");
    const errorBox = document.getElementById("login-error-box");
    const errorMsg = document.getElementById("login-error-msg");

    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>ກຳລັງກວດສອບ...</span>`;
    errorBox.classList.add("hidden");

    try {
      const res = await fetch("/api/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: u, password: p })
      });

      const data = await res.json();
      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> <span>ເຂົ້າສູ່ລະບົບ (Login)</span>`;

      if (res.ok && data.success) {
        window.location.href = "/admin";
      } else {
        errorBox.classList.remove("hidden");
        errorMsg.textContent = data.message || "ຊື່ຜູ້ໃຊ້ ຫຼື ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ";
      }
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> <span>ເຂົ້າສູ່ລະບົບ (Login)</span>`;
      errorBox.classList.remove("hidden");
      errorMsg.textContent = "ເກີດຂໍ້ຜິດພາດ: " + err.message;
    }
  }
  </script>

</body>
</html>
