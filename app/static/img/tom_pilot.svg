<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="pilotGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldRocket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="pilotBottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background Dark Cosmic Circle -->
  <circle cx="100" cy="100" r="88" fill="url(#pilotGlow)" stroke="#f59e0b" stroke-width="2.5"/>

  <!-- Golden Stars & Rings in Background -->
  <circle cx="100" cy="100" r="68" fill="none" stroke="#f59e0b" stroke-dasharray="4,6" opacity="0.4"/>
  <circle cx="45" cy="55" r="2.5" fill="#fde047"/>
  <circle cx="155" cy="50" r="3" fill="#fde047"/>
  <circle cx="160" cy="140" r="2" fill="#fde047"/>
  <circle cx="35" cy="130" r="2.5" fill="#fde047"/>

  <!-- Pilot Bottle Silhouette -->
  <rect x="76" y="55" width="48" height="95" rx="12" fill="url(#pilotBottle)" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="88" y="40" width="24" height="15" rx="3" fill="#d97706"/>
  <rect x="85" y="50" width="30" height="6" rx="2" fill="#fbbf24"/>

  <!-- Pilot Rocket Emblem in Center -->
  <path d="M 100 70 C 108 78 112 92 110 108 L 90 108 C 88 92 92 78 100 70 Z" fill="url(#goldRocket)"/>
  <!-- Wings -->
  <path d="M 90 98 L 80 112 L 90 108 Z" fill="#b45309"/>
  <path d="M 110 98 L 120 112 L 110 108 Z" fill="#b45309"/>
  <!-- Jet Flame -->
  <polygon points="95,108 100,122 105,108" fill="#ef4444"/>
  <polygon points="97,108 100,117 103,108" fill="#facc15"/>

  <!-- Pilot Text Banner -->
  <rect x="62" y="128" width="76" height="24" rx="6" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="100" y="144" font-family="Impact, Arial, sans-serif" font-size="14" font-weight="900" fill="#020617" letter-spacing="1.5" text-anchor="middle">PILOT</text>

  <!-- Glowing Aura -->
  <circle cx="100" cy="70" r="6" fill="#fde047" opacity="0.7"/>
</svg>
