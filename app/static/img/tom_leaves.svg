<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="60%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="syrupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
  </defs>

  <!-- Background Circle (Fresh Green Glow) -->
  <circle cx="100" cy="100" r="88" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>

  <!-- Big Kratom Leaf (Background) -->
  <path d="M 100 25 C 135 25 155 60 145 105 C 135 150 100 165 100 165 C 100 165 65 150 55 105 C 45 60 65 25 100 25 Z" fill="url(#leafGrad1)"/>
  
  <!-- Center Red Stem (Red Vein Kratom) -->
  <line x1="100" y1="28" x2="100" y2="168" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Leaf Veins (Red Veins) -->
  <line x1="100" y1="55" x2="128" y2="45" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="55" x2="72" y2="45" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="80" x2="135" y2="70" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="80" x2="65" y2="70" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="110" x2="130" y2="100" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="110" x2="70" y2="100" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>

  <!-- Foreground Syrup / Flavor Bottle on the Right -->
  <g transform="translate(105, 80) scale(0.65)">
    <!-- Cap (White) -->
    <rect x="25" y="0" width="20" height="12" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Bottle -->
    <rect x="10" y="12" width="50" height="90" rx="10" fill="url(#syrupGrad)" stroke="#9f1239" stroke-width="2"/>
    <!-- Label -->
    <rect x="15" y="32" width="40" height="42" rx="4" fill="#ffffff"/>
    <text x="35" y="52" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#e11d48" text-anchor="middle">SYRUP</text>
    <text x="35" y="66" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#0f172a" text-anchor="middle">ນ້ຳຢາ</text>
  </g>

  <!-- Sparkles -->
  <circle cx="45" cy="45" r="4" fill="#f59e0b"/>
  <circle cx="155" cy="40" r="3.5" fill="#f59e0b"/>
  <circle cx="40" cy="130" r="3" fill="#22c55e"/>
</svg>
