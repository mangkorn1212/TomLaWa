<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="packBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="90" fill="url(#packBg)" />
  
  <!-- Group of Bottles in Shrink Wrap -->
  <!-- Back Bottles -->
  <rect x="52" y="55" width="26" height="75" rx="8" fill="#93c5fd" opacity="0.7"/>
  <rect x="87" y="55" width="26" height="75" rx="8" fill="#93c5fd" opacity="0.7"/>
  <rect x="122" y="55" width="26" height="75" rx="8" fill="#93c5fd" opacity="0.7"/>

  <!-- Caps -->
  <rect x="58" y="47" width="14" height="9" rx="3" fill="#0369a1"/>
  <rect x="93" y="47" width="14" height="9" rx="3" fill="#0369a1"/>
  <rect x="128" y="47" width="14" height="9" rx="3" fill="#0369a1"/>

  <!-- Front Bottles -->
  <rect x="42" y="70" width="32" height="85" rx="10" fill="url(#bottleGrad)"/>
  <rect x="50" y="62" width="16" height="10" rx="3" fill="#0284c7"/>
  <rect x="44" y="105" width="28" height="22" fill="#ffffff" opacity="0.85" rx="4"/>

  <rect x="84" y="70" width="32" height="85" rx="10" fill="url(#bottleGrad)"/>
  <rect x="92" y="62" width="16" height="10" rx="3" fill="#0284c7"/>
  <rect x="86" y="105" width="28" height="22" fill="#ffffff" opacity="0.85" rx="4"/>

  <rect x="126" y="70" width="32" height="85" rx="10" fill="url(#bottleGrad)"/>
  <rect x="134" y="62" width="16" height="10" rx="3" fill="#0284c7"/>
  <rect x="128" y="105" width="28" height="22" fill="#ffffff" opacity="0.85" rx="4"/>

  <!-- Wrap Ribbon / Badge -->
  <rect x="36" y="125" width="128" height="22" rx="6" fill="#10b981"/>
  <text x="100" y="141" font-family="'Noto Sans Lao', Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">ແພັກຍົກຊຸດ PACK</text>
</svg>
