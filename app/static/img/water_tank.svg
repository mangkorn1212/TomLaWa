<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>
  <!-- Background Circle (Fresh Mint) -->
  <circle cx="100" cy="100" r="90" fill="#ecfdf5" />
  
  <!-- Cap / Neck -->
  <rect x="86" y="24" width="28" height="14" rx="4" fill="url(#capGrad)"/>
  <rect x="80" y="38" width="40" height="10" rx="3" fill="#a7f3d0"/>
  
  <!-- Main Barrel (Emerald Tank) -->
  <rect x="52" y="48" width="96" height="118" rx="20" fill="url(#tankGrad)"/>
  
  <!-- Ridges on Tank -->
  <rect x="55" y="70" width="90" height="10" rx="5" fill="#047857" opacity="0.4"/>
  <rect x="55" y="96" width="90" height="10" rx="5" fill="#047857" opacity="0.4"/>
  <rect x="55" y="122" width="90" height="10" rx="5" fill="#047857" opacity="0.4"/>

  <!-- Water Highlight Reflection -->
  <path d="M 64 56 Q 60 110 64 150" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6"/>
  
  <!-- Badge: 20L -->
  <rect x="74" y="80" width="52" height="26" rx="6" fill="#ffffff" opacity="0.95"/>
  <text x="100" y="98" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">20 L</text>
  
  <!-- Sparkles -->
  <circle cx="152" cy="48" r="4" fill="#34d399"/>
  <circle cx="44" cy="90" r="3" fill="#34d399"/>
</svg>
